packages:
  - packages/*
  - tooling/*

# Single source of truth for every version that appears in more than one
# package. Packages reference these as `catalog:`; pnpm rewrites the spec to the
# resolved version when packing or publishing, so consumers never see the
# protocol.
catalog:
  # toolchain
  '@changesets/cli': ^2.29.7
  '@types/node': ^26.6.4
  react: 18.3.1
  tsdown: 0.23.1
  typescript: 7.0.2

  # harness seams the plugins are built and tested against
  '@deepseek-ai/cordis': 4.0.5
  '@deepseek-ai/cosmokit': ^1.8.5
  '@deepseek-ai/schemastery': 3.18.5
  '@deepseek-ai/dsh-agent': 0.2.1-rc.2
  '@deepseek-ai/dsh-api-session-controller': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-session': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-workspace': 0.2.1-rc.2
  '@deepseek-ai/dsh-compaction': 0.2.1-rc.2
  '@deepseek-ai/dsh-compaction-basic': 0.2.1-rc.2
  '@deepseek-ai/dsh-home-paths': 0.2.1-rc.2
  '@deepseek-ai/dsh-host-webserver': 0.2.1-rc.2
  '@deepseek-ai/dsh-llm': 0.2.1-rc.2
  '@deepseek-ai/dsh-session': 0.2.1-rc.2
  '@deepseek-ai/dsh-system-prompt': 0.2.1-rc.2
  '@deepseek-ai/dsh-token-meter': 0.2.1-rc.2
  '@deepseek-ai/dsh-tools': 0.2.1-rc.2
