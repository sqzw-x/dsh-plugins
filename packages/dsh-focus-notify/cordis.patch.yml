# dsh-focus-notify profile patch layer — inserts the single loader entry for this
# plugin package. The browser half is picked up by dsh-client-modules through
# the package's `dsh.client` declaration, exactly like the shipped ui-* packages.
#
# Disable the plugin without uninstalling it:
#   - id: dsh-focus-notify
#     disabled: true
- insert:
    - id: dsh-focus-notify
      name: 'dsh-focus-notify'
