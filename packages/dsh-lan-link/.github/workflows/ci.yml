name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node 是 >=22.18；22 是下限，24 是当前稳定版。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 入口契约（可加载、导出齐全）
        run: |
          node -e "
          import('./lib/index.js').then((m) => {
            for (const key of ['name', 'apply', 'startLanGateway']) {
              if (!(key in m)) throw new Error('lib/index.js 缺少导出: ' + key);
            }
            if (m.name !== 'lan-link') throw new Error('插件名变了: ' + m.name);
            if (typeof m.apply !== 'function') throw new Error('apply 不是函数');
          });
          import('./lib/gateway.js').then((m) => {
            for (const key of ['startLanGateway', 'injectHeadScripts', 'parseCidrs', 'isAddressAllowed']) {
              if (!(key in m)) throw new Error('lib/gateway.js 缺少导出: ' + key);
            }
          });
          "
      - name: 打包内容预览
        run: npm pack --dry-run
