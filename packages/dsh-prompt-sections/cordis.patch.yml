# dsh-prompt-sections profile patch layer.
#
# One row. The row id (`prompt-sections`) is the profile entry id; the package
# name (`dsh-prompt-sections`) is what resolves on disk. Both halves — the host
# prompt registration and the Web settings section — ship from that one row.
#
# Optional configuration:
#
#   - id: prompt-sections
#     name: dsh-prompt-sections
#     config:
#       enabled: true                 # master switch; false registers nothing
#       storeFile: ''                 # override the JSON store path
#       maxSectionBytes: 8192         # per-section soft cap reported by the UI
#
- insert:
    - id: prompt-sections
      name: dsh-prompt-sections
