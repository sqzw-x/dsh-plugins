name: CI

# Everything this repository ships is built and tested here: no per-package
# workflows. The workspace is deliberately small enough that a full run is
# cheaper than computing an affected-package graph — revisit that if the run
# starts to dominate.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tsdown 0.23 needs a modern Node; the shipped artifacts themselves run
        # wherever the harness runs.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and test every package
        run: pnpm verify
      - name: Bundle contracts and package contents
        if: matrix.node == 24
        run: |
          node scripts/assert-bundles.ts
          pnpm pack:dry
